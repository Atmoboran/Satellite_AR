<body class="full-stage">

<header class="top">
  <a class="logo" href="index.html" data-brand="logo"></a>
  <div class="top-right">
    <nav class="nav" data-t-aria="chapters.aria">
      <a href="index.html"><span data-t="chapters.start"></span></a>
      <a href="satellit.html"><span class="num">1</span><span data-t="chapters.ar"></span></a>
      <a href="bahnen.html"><span class="num">2</span><span data-t="chapters.bahnen"></span></a>
      <a href="kanaele.html" aria-current="page"><span class="num">3</span><span data-t="chapters.kanaele"></span></a>
      <a href="messen.html"><span class="num">4</span><span data-t="chapters.messen"></span></a>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="40" cy="60" r="26" fill="currentColor"/><circle cx="80" cy="60" r="26" fill="currentColor"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><circle cx="150" cy="170" r="110"/><circle cx="250" cy="170" r="110"/><circle cx="200" cy="255" r="110"/></svg>
  <div class="poster-text">
    <p class="kicker" data-t="kanaele.poster.kicker"></p>
    <h1 class="headline" data-t-html="kanaele.poster.headline"></h1>
    <p class="lead" data-t="kanaele.poster.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-stage">
      <div class="chip-ctl outside" role="group" data-t-aria="kanaele.channelAria">
        <button type="button" class="chip-btn" data-ch="vis" aria-pressed="true"><i></i><span data-t="kanaele.channels.vis.chip"></span></button>
        <button type="button" class="chip-btn" data-ch="ir" aria-pressed="false"><i></i><span data-t="kanaele.channels.ir.chip"></span></button>
        <button type="button" class="chip-btn" data-ch="wv" aria-pressed="false"><i></i><span data-t="kanaele.channels.wv.chip"></span></button>
      </div>
      <div class="stage-frame fill wide dark" id="stage-frame">
        <canvas class="layer" id="image" role="img" data-t-aria="kanaele.stageAria"></canvas>
        <p class="busy" id="busy" hidden data-t="kanaele.computing"></p>
        <p class="stage-note stage-note-top" data-t="kanaele.stageNote"></p>
      </div>
    </div>

    <div class="lab-post">
      <p class="model-note muted" data-t="kanaele.stageNote"></p>
      <p class="legend-title" data-t="kanaele.sceneTitle"></p>
      <div class="seg scene-seg" role="group" data-t-aria="kanaele.sceneAria">
        <button type="button" class="chip-btn" data-scene="herbst" aria-pressed="true"><span data-t="kanaele.scenes.herbst.label"></span></button>
        <button type="button" class="chip-btn" data-scene="sommer" aria-pressed="false"><span data-t="kanaele.scenes.sommer.label"></span></button>
        <button type="button" class="chip-btn" data-scene="winter" aria-pressed="false"><span data-t="kanaele.scenes.winter.label"></span></button>
      </div>
      <p class="scene-text" id="scene-text"></p>

      <div class="ctl-row">
        <div class="seg time-seg" role="group" data-t-aria="kanaele.controls.timeAria">
          <button type="button" class="chip-btn" data-time="day" aria-pressed="true"><span data-t="kanaele.controls.day"></span></button>
          <button type="button" class="chip-btn" data-time="night" aria-pressed="false"><span data-t="kanaele.controls.night"></span></button>
        </div>
        <button type="button" class="info" aria-controls="controls-help" data-t-aria="kanaele.controls.infoAria"></button>
      </div>
      <div class="info-note" id="controls-help" hidden data-t-html="kanaele.controls.note"></div>

      <div class="legend" id="legend">
        <p class="legend-title" id="legend-title"></p>
        <canvas id="legend-bar"></canvas>
        <div class="legend-ticks" id="legend-ticks"></div>
        <div class="legend-ends"><span id="legend-low"></span><span id="legend-high"></span></div>
      </div>

      <div class="mode-card" id="mode-card">
        <h2 id="mode-title"></h2>
        <p class="sub" id="mode-sub"></p>
        <ul id="mode-bullets"></ul>
      </div>

      <figure class="spectrum">
        <figcaption class="legend-title" data-t="kanaele.spectrum.title"></figcaption>
        <svg id="spectrum" viewBox="0 0 400 150" role="img" data-t-aria="kanaele.spectrum.aria"></svg>
        <ul class="key spectrum-key" aria-hidden="true">
          <li><i class="ln sun"></i><span data-t="kanaele.spectrum.sun"></span></li>
          <li><i class="ln earth"></i><span data-t="kanaele.spectrum.earth"></span></li>
          <li><i class="sw absorb"></i><span data-t="kanaele.spectrum.absorb"></span></li>
          <li><i class="sw visible"></i><span data-t="kanaele.spectrum.visible"></span></li>
        </ul>
      </figure>

      <button type="button" class="btn tasks-open" id="tasks-open" aria-haspopup="dialog" aria-controls="tasks-dialog">
        <span data-t="tasksDialog.open"></span> <span class="quiz-progress" id="tasks-progress"></span>
      </button>
      <div class="merke locked" data-for="channel-tasks">
        <h3 data-t="kanaele.merke.title"></h3>
        <p data-t="kanaele.merke.text"></p>
        <span class="locked-note"></span>
      </div>
    </div>
  </div>

  <dialog class="quiz-dialog" id="tasks-dialog" aria-labelledby="tasks-title">
    <div class="quiz-head">
      <h2 id="tasks-title" data-t="tasksDialog.title"></h2>
      <button type="button" class="quiz-close" id="tasks-close" data-t-aria="tasksDialog.closeAria">&times;</button>
    </div>
    <p class="quiz-intro" data-t="tasksDialog.intro"></p>
    <div id="channel-tasks">
      <ol class="quiz-list">
        <li class="quiz-item" data-task="night"><p class="quiz-q" data-t="kanaele.tasks.night"></p><p class="quiz-feedback" data-t="kanaele.tasks.doneNight"></p></li>
        <li class="quiz-item" data-task="fog"><p class="quiz-q" data-t="kanaele.tasks.fog"></p><p class="quiz-feedback" data-t="kanaele.tasks.doneFog"></p></li>
        <li class="quiz-item" data-task="snow"><p class="quiz-q" data-t="kanaele.tasks.snow"></p><p class="quiz-feedback" data-t="kanaele.tasks.doneSnow"></p></li>
      </ol>
    </div>
  </dialog>

  <div class="topics">
    <details class="topic"><summary data-t="kanaele.topics.filters.title"></summary><div class="topic-body" data-t-html="kanaele.topics.filters.body"></div></details>
    <details class="topic"><summary data-t="kanaele.topics.ir.title"></summary><div class="topic-body" data-t-html="kanaele.topics.ir.body"></div></details>
    <details class="topic"><summary data-t="kanaele.topics.wv.title"></summary><div class="topic-body" data-t-html="kanaele.topics.wv.body"></div></details>
    <details class="topic"><summary data-t="kanaele.topics.more.title"></summary><div class="topic-body" data-t-html="kanaele.topics.more.body"></div></details>
    <details class="topic"><summary data-t="kanaele.topics.model.title"></summary><div class="topic-body" data-t-html="kanaele.topics.model.body"></div></details>
    <details class="topic"><summary data-t="kanaele.topics.sources.title"></summary><div class="topic-body" data-t-html="kanaele.topics.sources.body"></div></details>
  </div>

  <div class="next-part split">
    <a class="btn big" href="bahnen.html"><span aria-hidden="true">←</span> <span data-t="chapters.toBahnen"></span></a>
    <a class="btn big primary" href="messen.html"><span data-t="chapters.toMessen"></span> <span aria-hidden="true">→</span></a>
  </div>
</main>

</html>
