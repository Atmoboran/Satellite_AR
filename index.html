<!DOCTYPE html>
<html lang="de" data-variant="standard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTG-I1 – Wettersatellit in AR</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/
     Generated by build.py – change the template there, then run: python3 build.py -->
<script src="js/view.js" data-app="satellit"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <span class="logo" data-brand="logo"></span>
  <div class="top-right">
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 120 120" aria-hidden="true">
    <rect x="44" y="40" width="32" height="40" fill="currentColor"/>
    <rect x="4" y="50" width="34" height="20" fill="currentColor"/>
    <rect x="82" y="50" width="34" height="20" fill="currentColor"/>
    <rect x="38" y="58" width="6" height="4" fill="currentColor"/><rect x="76" y="58" width="6" height="4" fill="currentColor"/>
    <circle cx="60" cy="96" r="9" fill="currentColor"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="70"/><circle cx="200" cy="200" r="185"/></svg>
  <div class="poster-text">
    <h1 class="headline" data-t-html="page.poster.headline"></h1>
    <p class="lead" data-t="page.poster.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-stage">
      <div class="stage-frame square fit" id="stage-frame">
        <model-viewer
          id="viewer"
          src="MTGI.glb"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="auto"
          ar-placement="floor"
          camera-controls
          auto-rotate
          rotation-per-second="8deg"
          touch-action="pan-y"
          camera-orbit="35deg 75deg auto"
          min-camera-orbit="auto auto auto"
          max-camera-orbit="auto auto auto">
          <button type="button" slot="ar-button" id="ar-button" class="btn primary big">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2v6m0 8v6M4.9 4.9l4.2 4.2m5.8 5.8l4.2 4.2M2 12h6m8 0h6M4.9 19.1l4.2-4.2m5.8-5.8l4.2-4.2"/></svg>
            <span><span data-t="ar.label"></span><span class="sub" data-t="ar.sub"></span></span>
          </button>
        </model-viewer>
      </div>
    </div>

    <div class="lab-post">
      <p class="readout" id="part-readout" aria-live="polite" data-t="part.idle"></p>
      <p class="hint" data-t="page.hint"></p>

      <div class="controls">
        <button type="button" class="btn" id="rotate-btn" aria-pressed="false" data-t="controls.rotate"></button>
        <button type="button" class="info" aria-controls="controls-note" data-t-aria="controls.infoAria"></button>
      </div>
      <div class="info-note" id="controls-note" hidden data-t-html="page.controlsNote"></div>
      <p class="desk-note" id="desk-note" hidden data-t="ar.deskNote"></p>
      <p class="desk-note" id="load-error" hidden data-t="ar.loadError"></p>

      <div class="readout-grid facts" role="group" data-t-aria="facts.aria">
        <div><span data-t="page.facts.0.label"></span><b data-t="page.facts.0.value"></b></div>
        <div><span data-t="page.facts.1.label"></span><b data-t="page.facts.1.value"></b></div>
        <div><span data-t="page.facts.2.label"></span><b data-t="page.facts.2.value"></b></div>
        <div><span data-t="page.facts.3.label"></span><b data-t="page.facts.3.value"></b></div>
      </div>

      <div class="tasks" id="sat-tasks">
        <h3 data-t="tasks.title"></h3>
        <ul>
          <li data-task="turn"><span class="box"></span><span data-t="tasks.turn"></span></li>
          <li data-task="wing"><span class="box"></span><span data-t="tasks.wing"></span></li>
        </ul>
      </div>
      <div class="merke locked" data-for="sat-tasks">
        <h3 data-t="merke.title"></h3>
        <p data-t="merke.text"></p>
        <span class="locked-note"></span>
      </div>
    </div>
  </div>

  <div class="topics">
    <details class="topic"><summary data-t="topics.orbit.title"></summary><div class="topic-body" data-t-html="topics.orbit.body"></div></details>
    <details class="topic"><summary data-t="topics.job.title"></summary><div class="topic-body" data-t-html="topics.job.body"></div></details>
    <details class="topic"><summary data-t="topics.size.title"></summary><div class="topic-body" data-t-html="topics.size.body"></div></details>
    <details class="topic"><summary data-t="topics.ar.title"></summary><div class="topic-body" data-t-html="topics.ar.body"></div></details>
  </div>
</main>

<footer class="foot">
  <p class="sources" data-t="sources"></p>
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/vendor/model-viewer-umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
